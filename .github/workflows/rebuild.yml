# The site pulls Substack posts at build time, so rebuild it periodically
# to pick up new posts. Requires a Cloudflare Pages deploy hook URL stored
# in the CLOUDFLARE_DEPLOY_HOOK_URL repository secret.
name: Rebuild site

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
